spring:
  datasource:
    hikari:
      connection-init-sql: "SET lock_timeout = '1s'"
      maximum-pool-size: 20

meshpay:
  keys:
    master-key: dGVzdC1tYXN0ZXIta2V5LTMyLWJ5dGVzLWV4YWN0bHk=
  bridge:
    tokens:
      bridge-1: test-token-bridge-one-0123456789
      bridge-2: test-token-bridge-two-0123456789
      bridge-3: test-token-bridge-three-012345678
    rate-limit-capacity: 10000
    rate-limit-refill-per-second: 10000
  wallet:
    sweep-interval: PT1000H   # tests call the sweeper explicitly

logging:
  level:
    com.demo.upimesh: WARN
