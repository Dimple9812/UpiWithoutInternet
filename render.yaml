# Render Blueprint: deploys the MeshPay simulator website on Render's free plan.
# Database: a free Neon PostgreSQL project (Render's own free Postgres expires
# after 30 days). See DEPLOY.md for the step-by-step guide.
services:
  - type: web
    name: meshpay
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo,cloud
      # Paste these from Neon when Render asks (see DEPLOY.md)
      - key: MESHPAY_DB_URL
        sync: false
      - key: MESHPAY_DB_USER
        sync: false
      - key: MESHPAY_DB_PASSWORD
        sync: false
      # Random 256-bit base64 values generated by Render, never stored in the repo
      - key: MESHPAY_MASTER_KEY
        generateValue: true
      - key: MESHPAY_DEMO_BRIDGE_TOKEN
        generateValue: true
