# Local infrastructure for MeshPay: PostgreSQL + Redis.
#   docker compose up -d
#   SPRING_PROFILES_ACTIVE=demo ./mvnw spring-boot:run
# (Phase 4 adds the app container for a true one-command start.)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meshpay
      POSTGRES_USER: meshpay
      POSTGRES_PASSWORD: meshpay
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshpay"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
